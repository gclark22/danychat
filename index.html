<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b1a">
  <title>Danychat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Ctext x='16' y='23.5' font-size='21' font-family='sans-serif' font-weight='900' text-anchor='middle' fill='white'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="auth" hidden></div>

    <div id="shell" hidden>
      <header class="topbar">
        <div class="brand">
          <!-- The logo: the name, one word per line -->
          <div class="text-logo" role="img" aria-label="Dany Fuad Dahan"><span aria-hidden="true">Dany</span><span aria-hidden="true">Fuad</span><span aria-hidden="true">Dahan</span></div>
          <h1>Danychat</h1>
        </div>
        <div class="top-actions">
          <button id="btn-post" class="icon-btn" hidden aria-label="Post a video">＋</button>
          <button id="btn-coins" class="coin-chip" type="button" aria-label="Dan Coins — open the Dan Shop">🪙 0</button>
          <button id="btn-me" class="plain" aria-label="Your profile"></button>
        </div>
      </header>

      <main>
        <section id="view-chat" class="view" hidden></section>
        <section id="view-watch" class="view" hidden></section>
        <section id="view-games" class="view" hidden></section>
        <section id="view-friends" class="view" hidden></section>
        <section id="view-me" class="view" hidden></section>
      </main>

      <nav class="tabbar" aria-label="Main">
        <button data-tab="chat"><span class="ico">💬</span><span>Chat</span><i class="badge" id="badge-chat" hidden></i></button>
        <button data-tab="watch"><span class="ico">▶️</span><span>Watch</span></button>
        <button data-tab="games"><span class="ico">🎮</span><span>Games</span></button>
        <button data-tab="friends"><span class="ico">👥</span><span>Friends</span><i class="badge" id="badge-friends" hidden></i></button>
        <button data-tab="me"><span class="ico">🙂</span><span>Me</span></button>
      </nav>
    </div>

    <div id="overlay-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="avatar.js"></script>
  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
